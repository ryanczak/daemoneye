# daemoneye egress proxy. Static; the per-profile allowlist is mounted at
# /etc/tinyproxy/filter by the daemon (M19 phase-08 renders it).
Port 8888
Listen 0.0.0.0
Timeout 30
LogLevel Info
Allow 0.0.0.0/0
FilterDefaultDeny Yes
FilterType fnmatch
Filter "/etc/tinyproxy/filter"
ConnectPort 443
ConnectPort 563
MaxClients 20
