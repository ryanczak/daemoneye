[package]
name = "daemoneye"
version = "1.0.0"
edition = "2024"
description = "An AI-powered terminal assistant that embeds into tmux — streams responses, runs commands, watches panes, and operates autonomously via ghost shells"
license = "MIT"
authors = ["Matt Ryanczak <matt@ryanczak.org>"]
repository = "https://github.com/ryanczak/daemoneye"
keywords = ["tmux", "ai", "automation", "assistant", "sre"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures-util = "0.3"
# Pinned to 0.2: libc's only newer release is 1.0.0-alpha.4, a pre-release.
libc = "0.2"
log = "0.4"
nix = { version = "0.31.3", features = ["fs"] }
# PTY spawn/resize behind a safe API — chosen so no `unsafe` (openpty, forkpty,
# TIOCSCTTY) enters this crate; STANDARDS.md §1 forbids it in phase work.
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
# `scrolling-regions` makes the inline viewport's `insert_before` scroll new
# transcript lines in above the viewport via DECSTBM instead of clearing and
# repainting the input box — this stops the input border from flashing on every
# committed line (an accessibility hazard).
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions"] }
crossterm = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "time", "process"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
# Terminal emulation for the shell screen model — turns a raw PTY byte stream
# into a cell grid, so colour is read off parsed cells instead of re-parsing
# escape sequences out of a string.
vt100 = "0.16"

[dev-dependencies]
filetime = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
