# DaemonEye configuration — ~/.daemoneye/etc/config.toml
#
# At minimum, uncomment one [models.default] block and fill in your API key.
# To use additional models (agent runbooks, /model command, digest), uncomment
# more blocks and give each a unique key name.
#
# Pricing rates are USD per 1M tokens.  Keep them current — providers change
# rates without notice.
#   Anthropic  https://www.anthropic.com/pricing
#   OpenAI     https://openai.com/api/pricing/
#   Gemini     https://ai.google.dev/gemini-api/docs/pricing

# ── Anthropic ────────────────────────────────────────────────────────────────

[models.default]
provider = "anthropic"
api_key  = ""
model    = "claude-sonnet-4-6"
input_cost_per_mtok       = 3.00
output_cost_per_mtok      = 15.00
cache_read_cost_per_mtok  = 0.30
cache_write_cost_per_mtok = 3.75
# max_tokens = 8192   # per-response generation cap (default 8192)

