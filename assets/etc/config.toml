# ── AI prompt ────────────────────────────────────────────────────────────────

[ai]
prompt = "sre"
# Two-phase stream bounds.  A generation may run arbitrarily long as long as
# tokens keep arriving; only a genuine stall ends it.  A stall before the first
# token is retried (nothing reached you yet); a mid-stream stall never is (a
# re-issue would duplicate output).
# first_token_timeout_secs = 600   # max wait for the first token (default: 600)
# stream_idle_timeout_secs = 240   # max gap between chunks mid-stream (default: 240)
# connect_timeout_secs     = 30    # TCP/TLS connect budget (default: 30).  This is the
#                                  # only timeout on the shared HTTP client — there is
#                                  # deliberately no total request timeout.

# ── Context ──────────────────────────────────────────────────────────────────

# [context]
# Declare the operating environment so the AI calibrates its advice accordingly.
# Values: "personal" | "development" | "staging" | "production"
# environment = "personal"

# ── Masking ──────────────────────────────────────────────────────────────────

# [masking]
# Add org-specific patterns to redact before context is sent to the AI.
# Built-in patterns (AWS keys, JWTs, DB URLs, private keys, etc.) always run.
# extra_patterns = ["MYCO-[A-Z0-9]{32}", "sk_live_[A-Za-z0-9]{32}"]

# ── Notifications ─────────────────────────────────────────────────────────────

# [notifications]
# Shell command to run when a watchdog alert fires.
# Available env vars: $DAEMONEYE_JOB (job name), $DAEMONEYE_MSG (alert message).
# on_alert = "notify-send '$DAEMONEYE_JOB' '$DAEMONEYE_MSG'"

# ── Webhook ──────────────────────────────────────────────────────────────────

# [webhook]
# enabled = false
# port = 9393
# secret = ""            # Bearer token; empty = no auth (allowed loopback only)
# auto_analyze = true
# severity_threshold = "warning"   # "info" | "warning" | "critical"
# dedup_window_secs = 300
# bind_addr = "127.0.0.1"          # non-loopback + empty secret -> daemon refuses to start
# (per-IP rate limit: 30 req per 60 s window, constants in src/webhook/server.rs)

# ── Limits ───────────────────────────────────────────────────────────────────

# [limits]
# per_tool_batch            = 100    # max consecutive calls of one non-approval tool per turn (0 = unlimited)
# total_tool_calls_per_turn = 0      # max total non-approval tool calls per turn (0 = unlimited)
# tool_result_chars         = 16000  # max chars fed back to the AI per tool result (0 = unlimited)
# max_turns                 = 0      # max AI turns per chat session (0 = unlimited; ghosts use max_ghost_turns)
# max_tool_calls_per_session = 0     # cumulative non-approval tool calls per session (0 = unlimited)
# turn_timeout_secs         = 0      # wall-clock ceiling on one chat turn incl. tool execution
#                                    # (0 = no deadline; ghosts use their own 300 s bound)

# [limits.per_tool]
# read_file         = 200   # override per_tool_batch for this tool only (0 = unlimited for this tool)
# search_repository = 50

# ── Ghost shells ─────────────────────────────────────────────────────────────

# [ghost]
# max_ghost_turns = 20        # hard ceiling; individual runbooks may set lower
# max_concurrent_ghosts = 3   # ghost shells that may run at once (0 = unlimited; default: 3)

# ── Sandbox ──────────────────────────────────────────────────────────────────

# [sandbox]
# Container-sandboxed agent command execution. Nothing here takes effect
# while `enabled` is false; later M18 phases consume these values. The
# defaults describe the safe, disabled state.
#
# enabled     = false                    # master feature flag
# runtime     = "docker"                 # only supported value today
# image       = "daemoneye-agent-base"   # tag pinned by digest in sandbox.lock
# proxy_image = "daemoneye-egress-proxy"  # egress proxy image, pinned in proxy.lock (M19)
# workdir     = "/de/work"               # container scratch mount point
# run_as      = "1000:1000"              # NEVER container root: under rootless
#                                        # Docker container root IS the daemon's
#                                        # host uid, defeating the sandbox
# docker_host = "unix:///run/user/1000/docker.sock"   # rootless per-user socket
#
# [sandbox.limits]
# memory  = "1g"   # per-container memory ceiling (`--memory`)
# pids    = 256    # max PIDs inside the container (`--pids-limit`) bounds a fork bomb
# cpus    = 2.0    # CPU quota (`--cpus`)
# scratch = "2g"   # /de/work tmpfs size
#
# [sandbox.profile]
# Per-profile policy, keyed by agent/profile name. A profile absent here gets
# the defaults (network "none", empty proxy_allow).
# [sandbox.profile.researcher]
# network      = "proxy"    # "none" (default, no route out) or "proxy" (egress
#                           # via the containerized proxy on a shared network)
# proxy_allow  = ["crates.io"]   # only consulted when network = "proxy"
#
# [sandbox.ghost_defaults]
# destroy_on_exit = true   # destroy the container on ghost exit, every path
# mount_scripts   = "ro"   # mount mode for the staged script volume

# ── Daemon ───────────────────────────────────────────────────────────────────

# [daemon]
# tmux_session = "daemoneye"   # session the daemon creates/adopts when launched outside tmux
#                              # (default is "daemoneye"; override to use a different name)

# ── Digest ───────────────────────────────────────────────────────────────────

# [digest]
# Session-compaction settings.  The structured digest (event tallies and
# artifact scans) always runs when token pressure crosses the digest
# threshold; the narrative step is opt-in because it costs one extra API
# call per compaction.
# narrative_enabled = true     # set to false to skip the AI-generated
#                              # natural-language summary of the compacted
#                              # turns to each digest.  Uses [models.digest]
#                              # if defined, otherwise [models.default].

# ── Sessions ─────────────────────────────────────────────────────────────────

# [sessions]
# Named session persistence settings.
# auto_name_enabled = true         # propose a name after N turns (default: true)
# auto_name_turn_threshold = 10    # turns before auto-name suggestion fires (default: 10)
# load_recent_turns = 10           # messages loaded when resuming (0 = all; default: 10)
# archive_retention_days = 0       # delete archived session data older than this
#                                  # (0 = keep forever; default: 0)

# ── Approvals ────────────────────────────────────────────────────────────────

# [approvals]
# Controls which action classes auto-approve at the start of every chat
# session.  All defaults preserve the original behaviour — only `commands`
# starts as true because non-sudo commands are bounded by OS file permissions.
# Individual approvals can always be revoked at runtime with /approvals revoke.
# `revoke` always fully gates, regardless of these defaults.
#
# commands      = true   # non-sudo terminal commands (default: true)
# sudo          = false  # sudo terminal commands (default: false)
# scripts       = false  # all write_script calls (default: false)
# runbooks      = false  # all write_runbook calls (default: false)
# file_edits    = false  # all edit_file calls (default: false)
# ghost_commands = false # ghost shell non-sudo commands without auto_approve_scripts
#                        # (can also be set per-runbook: auto_approve_commands: true)

# ── Compaction ───────────────────────────────────────────────────────────────

# [compaction]
# Token-pressure context management.  All values are percentages of the active
# model's context window, so they scale with whichever model the session uses.
# elide_at_pct     = 50     # elide oversized old tool results at this % (default: 50)
# compact_at_pct   = 60     # build an epoch and cut the working set at this % (default: 60)
# target_pct       = 40     # post-compaction working-set target (default: 40)
# emergency_pct    = 85     # synchronous, model-call-free backstop (default: 85)
# rollup_after     = 10     # fold the oldest 5 epochs into a chapter past this
#                           # many uncovered epochs (default: 10)
# extract_memories = false  # opt-in: extract durable facts to memory on each
#                           # epoch build (default: false)

# ── Events ───────────────────────────────────────────────────────────────────

# [events]
# retention_days = 90   # delete dated events.jsonl segments older than this
#                       # (0 = keep forever; default: 90)

# ── Logging ──────────────────────────────────────────────────────────────────

# [logging]
# Rotation for ~/.daemoneye/var/log/daemon.log.
# log_max_bytes  = 5242880   # rotate once the log exceeds this size (default: 5 MiB)
# log_keep_count = 5         # rotated files to keep (default: 5)

# ── Retention ────────────────────────────────────────────────────────────────

# [retention]
# Sweeps for the two directories that grow without bound.
# pane_log_retention_days = 7   # delete captured pane logs older than this
#                               # (0 = keep forever; default: 7)
# mailbox_retention_days  = 7   # delete agent mailbox results older than this
#                               # (0 = keep forever; default: 7)
